<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
      color: #444;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #667eea;
    }

    .swap {
      display: block;
      margin: 15px auto;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #667eea;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .swap:hover {
      background: #5568d9;
    }

    button.convert {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.convert:hover {
      background: #5568d9;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      text-align: center;
      background: #f2f4ff;
      border-radius: 12px;
      color: #333;
    }

    #convertedAmount {
      font-size: 25px;
      font-weight: bold;
      color: #667eea;
      margin-top: 8px;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💱 Currency Converter</h1>

    <label for="amount">Amount</label>
    <input
      type="number"
      id="amount"
      placeholder="Enter amount"
      min="0"
      step="any"
    >

    <label for="fromCurrency">From</label>
    <select id="fromCurrency">
      <option value="USD">🇺🇸 USD - US Dollar</option>
      <option value="INR">🇮🇳 INR - Indian Rupee</option>
      <option value="EUR">🇪🇺 EUR - Euro</option>
      <option value="GBP">🇬🇧 GBP - British Pound</option>
      <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
      <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
      <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
      <option value="SGD">🇸🇬 SGD - Singapore Dollar</option>
    </select>

    <button class="swap" onclick="swapCurrencies()">⇅</button>

    <label for="toCurrency">To</label>
    <select id="toCurrency">
      <option value="INR">🇮🇳 INR - Indian Rupee</option>
      <option value="USD">🇺🇸 USD - US Dollar</option>
      <option value="EUR">🇪🇺 EUR - Euro</option>
      <option value="GBP">🇬🇧 GBP - British Pound</option>
      <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
      <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
      <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
      <option value="SGD">🇸🇬 SGD - Singapore Dollar</option>
    </select>

    <button class="convert" onclick="convertCurrency()">
      Convert Currency
    </button>

    <div class="result">
      <div>Converted Amount</div>
      <div id="convertedAmount">--</div>
    </div>

    <div id="error" class="error"></div>

    <div class="footer">
      Currency Converter | HTML • CSS • JavaScript
    </div>

  </div>

  <script>
    async function convertCurrency() {

      const amount = parseFloat(
        document.getElementById("amount").value
      );

      const from = document.getElementById("fromCurrency").value;
      const to = document.getElementById("toCurrency").value;

      const result = document.getElementById("convertedAmount");
      const error = document.getElementById("error");

      error.textContent = "";

      if (!amount || amount <= 0) {
        error.textContent = "Please enter a valid amount.";
        result.textContent = "--";
        return;
      }

      if (from === to) {
        result.textContent = amount.toFixed(2) + " " + to;
        return;
      }

      try {

        result.textContent = "Converting...";

        const response = await fetch(
          `https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`
        );

        if (!response.ok) {
          throw new Error("Unable to fetch exchange rate");
        }

        const data = await response.json();

        const converted = data.rates[to];

        result.textContent =
          converted.toFixed(2) + " " + to;

      } catch (err) {

        result.textContent = "--";
        error.textContent =
          "Unable to get exchange rate. Please check your internet connection.";

      }
    }

    function swapCurrencies() {

      const from = document.getElementById("fromCurrency");
      const to = document.getElementById("toCurrency");

      const temp = from.value;
      from.value = to.value;
      to.value = temp;

      convertCurrency();
    }
  </script>

</body>
</html>
